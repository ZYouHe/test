name: Run Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester123
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U tester -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_USER: tester
          DB_PASSWORD: tester123
          DB_NAME: testdb
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p test-reports
          pytest -v --tb=short \
            --cov=app --cov-report=term-missing \
            --junitxml=test-reports/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-reports/
